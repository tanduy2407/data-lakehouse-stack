version: '3.8'

# Processing layer: AWS Glue + Spark ETL jobs
# Depends on: metadata (hive-metastore)

x-glue-job-common: &glue-job-common
  image: amazon/aws-glue-libs:5
  environment: &glue-job-env
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY}
    HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    SPARK_SQL_WAREHOUSE_DIR: s3a://${MINIO_WAREHOUSE_BUCKET}/
    SPARK_HADOOP_FS_S3A_ENDPOINT: ${MINIO_ENDPOINT}
    SPARK_HADOOP_FS_S3A_ACCESS_KEY: ${MINIO_ROOT_USER}
    SPARK_HADOOP_FS_S3A_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    SPARK_HADOOP_FS_S3A_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS}
    INGEST_WATERMARK_PATH: ${INGEST_WATERMARK_PATH}
    TRANSFORM_WATERMARK_PATH: ${TRANSFORM_WATERMARK_PATH}
    AGGREGATE_WATERMARK_PATH: ${AGGREGATE_WATERMARK_PATH}
  volumes:
    - ./hive/conf/core-site.xml:/usr/lib/spark/conf/core-site.xml:ro
    - ./glue/scripts:/home/glue/scripts
    - ./glue/data:/home/glue/data
    - ./hive/jars/postgresql-42.7.4.jar:/home/glue/jars/postgresql-42.7.4.jar:ro
  networks:
    - data-lakehouse-stack_network
  depends_on:
    hive-metastore:
      condition: service_healthy
    minio:
      condition: service_healthy
    postgres:
      condition: service_healthy

x-glue-job-submit-command: &glue-job-submit-command
  - "-c"
  - >-
    spark-submit
    --jars /home/glue/jars/postgresql-42.7.4.jar
    --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    --conf spark.hadoop.fs.s3a.endpoint=${MINIO_ENDPOINT}
    --conf spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
    --conf spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
    --conf spark.hadoop.fs.s3a.path.style.access=${S3_PATH_STYLE_ACCESS}
    --conf spark.hadoop.fs.s3a.bucket.${MINIO_WAREHOUSE_BUCKET}.access.key=${MINIO_ROOT_USER}
    --conf spark.hadoop.fs.s3a.bucket.${MINIO_WAREHOUSE_BUCKET}.secret.key=${MINIO_ROOT_PASSWORD}
    --conf spark.hadoop.fs.s3a.bucket.${MINIO_WAREHOUSE_BUCKET}.endpoint=${MINIO_ENDPOINT}
    --conf spark.hadoop.fs.s3a.bucket.${MINIO_WAREHOUSE_BUCKET}.path.style.access=${S3_PATH_STYLE_ACCESS}
    --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
    --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    --conf spark.hadoop.fs.s3a.bucket.${MINIO_WAREHOUSE_BUCKET}.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    /home/glue/scripts/${GLUE_JOB_SCRIPT}

services:
  glue:
    image: amazon/aws-glue-libs:5
    container_name: glue
    ports:
      - "4040:4040"
      - "18080:18080"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY}
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
      SPARK_SQL_WAREHOUSE_DIR: s3a://${MINIO_WAREHOUSE_BUCKET}/
      SPARK_HADOOP_FS_S3A_ENDPOINT: ${MINIO_ENDPOINT}
      SPARK_HADOOP_FS_S3A_ACCESS_KEY: ${MINIO_ROOT_USER}
      SPARK_HADOOP_FS_S3A_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SPARK_HADOOP_FS_S3A_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS}
      INGEST_WATERMARK_PATH: ${INGEST_WATERMARK_PATH}
      TRANSFORM_WATERMARK_PATH: ${TRANSFORM_WATERMARK_PATH}
      AGGREGATE_WATERMARK_PATH: ${AGGREGATE_WATERMARK_PATH}
    volumes:
      - ./hive/conf/core-site.xml:/usr/lib/spark/conf/core-site.xml:ro
      - ./glue/scripts:/home/glue/scripts
      - ./glue/data:/home/glue/data
      - ./hive/jars/postgresql-42.7.4.jar:/home/glue/jars/postgresql-42.7.4.jar:ro
    networks:
      - data-lakehouse-stack_network
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["-c", "sleep infinity"]

  glue-ingest:
    <<: *glue-job-common
    container_name: glue-ingest
    environment:
      <<: *glue-job-env
      GLUE_JOB_SCRIPT: ingest.py
    command: *glue-job-submit-command

  glue-transform:
    <<: *glue-job-common
    container_name: glue-transform
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      glue-ingest:
        condition: service_completed_successfully
    environment:
      <<: *glue-job-env
      GLUE_JOB_SCRIPT: transform.py
    command: *glue-job-submit-command

  glue-aggregate:
    <<: *glue-job-common
    container_name: glue-aggregate
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      glue-transform:
        condition: service_completed_successfully
    environment:
      <<: *glue-job-env
      GLUE_JOB_SCRIPT: aggregate.py
    command: *glue-job-submit-command

networks:
  data-lakehouse-stack_network:
    driver: bridge
